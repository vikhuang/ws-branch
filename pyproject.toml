[project]
name = "ws-branch"
version = "1.0.0.dev0"
description = "分點資料的清洗聚合與歸因量測(L1 tables / L2 measure / L3 products;PNL 時代封存於 pnl/)"
requires-python = ">=3.12"
dependencies = [
    "gcsfs>=2024.1",
    "numpy>=2.0.0",
    "polars>=1.0.0",
    "python-dotenv>=1.0",
    "ws-bot-core",
    "ws-core",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
ws-branch = "ws_branch.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_branch"]

[tool.pytest.ini_options]
testpaths = ["tests", "pnl/tests"]
pythonpath = ["src", "pnl", "."]

[tool.uv.sources]
ws-bot-core = { git = "https://github.com/vikhuang/ws-bot-core" }
# TEMP(redesign 分支施工期): 指向 flow-readers worktree;ws-core 該分支併 main 後改回 ../ws-core
ws-core = { path = "../ws-core-flow-readers", editable = true }
